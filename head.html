<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CCNA 1 Trainer</title>
<style>
:root{
  --bg:#000; --s1:#161617; --s2:#1d1d1f; --s3:#2c2c2e; --line:rgba(255,255,255,.12);
  --tx:#f5f5f7; --tx2:#a1a1a6; --tx3:#8e8e93;
  --blue:#2997ff; --btn:#0071e3; --ok:#30d158; --bad:#ff453a; --warn:#ffd60a;
  --r:22px; --c:#2997ff;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 96px}
.narrow{max-width:760px;margin:0 auto}

/* nav */
.nav{position:sticky;top:10px;z-index:20;max-width:1080px;margin:10px auto 0;padding:0 12px}
.nav-in{display:flex;align-items:center;gap:6px;background:rgba(29,29,31,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.brand{font-weight:600;font-size:17px;white-space:nowrap;background:none;border:0;padding:8px 0;margin-right:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-radius:999px;padding:9px 14px;font-size:14px;color:var(--tx2);white-space:nowrap;min-height:40px}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--s3);color:var(--tx)}

/* type */
.eyebrow{font-size:17px;font-weight:600;color:var(--tx2)}
.hero{padding:72px 0 36px}
.hero h1{font-size:clamp(46px,9vw,96px);line-height:1.02;font-weight:600;letter-spacing:-.04em;margin-top:6px}
.hero .sub{font-size:clamp(19px,2.4vw,24px);color:var(--tx2);margin-top:18px;max-width:640px;line-height:1.3}
.h2{font-size:clamp(30px,4.6vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.08;margin:64px 0 22px}
.h3{font-size:21px;font-weight:600;letter-spacing:-.02em}
.muted{color:var(--tx2)} .small{font-size:14px} .tiny{font-size:12px;color:var(--tx3)}

/* buttons */
.btn{appearance:none;border:0;border-radius:999px;padding:11px 22px;font-size:17px;font-weight:500;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--btn);color:#fff}
.btn.primary:hover{background:#0a7cf0}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.btn.ghost:hover{background:rgba(41,151,255,.12)}
.btn.dark{background:var(--s3);color:var(--tx)}
.btn.dark:hover{background:#3a3a3c}
.btn.sm{font-size:14px;padding:8px 16px;min-height:36px}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.link{background:none;border:0;padding:0;color:var(--blue);font-size:inherit}
.link:hover{text-decoration:underline}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:44px;text-align:center}
.stat .n{font-size:clamp(40px,7vw,64px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.stat .l{font-size:14px;color:var(--tx2)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--s3);margin-top:28px}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)} .bar .s{background:var(--warn)}
.bar.thin{height:6px;margin-top:14px}

/* cards */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--s1);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.tool{min-height:190px;justify-content:space-between;text-align:left;border:0;color:var(--tx);transition:background .2s}
.card.tool:hover{background:var(--s2)}
.card.tool .go{color:var(--blue);font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:5px 12px;border:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--s3);color:var(--tx2);white-space:nowrap}
.pill.known{color:var(--ok);background:rgba(48,209,88,.14)}
.pill.shaky{color:var(--warn);background:rgba(255,214,10,.14)}
.tcard .name{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;letter-spacing:-.02em}
.tcard .tfoot{margin-top:14px}

/* session */
.sess{padding-top:36px}
.shead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.shead .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.prog{height:4px;background:var(--s3);border-radius:9px;overflow:hidden;margin:6px 0 34px}
.prog i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .3s}
.q{font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:-.025em;line-height:1.18;white-space:pre-wrap}
.hint{color:var(--tx2);margin-top:10px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px;margin:28px 0 22px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--s1);border:1.5px solid transparent;border-radius:16px;padding:15px 18px;color:var(--tx);min-height:56px;transition:background .15s,border-color .15s}
.opt:not(:disabled):hover{background:var(--s2)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--tx2)}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.opt .tag{flex:none;font-size:12px;font-weight:600;padding-top:5px}
.opt.sel{border-color:var(--blue);background:rgba(41,151,255,.1)}
.opt.sel .k{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:rgba(48,209,88,.1)}
.opt.ok .k{background:var(--ok);color:#000}
.opt.ok .tag{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:rgba(255,69,58,.1)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.bad .tag{color:var(--bad)}
.opt.miss{border-style:dashed}
.why{border-radius:16px;background:var(--s1);padding:18px 20px;margin-bottom:22px;box-shadow:inset 3px 0 0 0 transparent}
.why b{display:block;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--c);margin-bottom:4px}
.verdict{font-size:21px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ico{width:22px;height:22px;flex:none}
.opt .k .ico{width:16px;height:16px}
.page>.h2:first-child{margin-top:44px}
.star{background:none;border:0;padding:8px;border-radius:50%;color:var(--tx3);display:grid;place-items:center;min-width:40px;min-height:40px}
.star.on{color:var(--warn)}
.star:hover{background:var(--s2)}
.qimg{max-width:100%;border-radius:12px;margin-top:18px;background:#fff}
.center{text-align:center}
.big{font-size:clamp(64px,14vw,128px);font-weight:600;letter-spacing:-.04em;line-height:1}

/* exam */
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:28px}
.pal button{height:40px;border-radius:10px;border:0;background:var(--s1);color:var(--tx2);font-size:14px;font-variant-numeric:tabular-nums}
.pal button.done{background:var(--s3);color:var(--tx)}
.pal button.cur{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--tx)}
.seg{display:inline-flex;background:var(--s1);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--tx2);border-radius:999px;padding:8px 16px;font-size:15px;min-height:38px}
.seg button.on{background:var(--s3);color:var(--tx)}

/* lists, tables, forms */
.field{width:100%;background:var(--s1);border:1.5px solid transparent;border-radius:14px;padding:13px 16px;font-size:17px;color:var(--tx);min-height:48px}
.field::placeholder{color:var(--tx3)}
.field:focus{outline:none;border-color:var(--blue)}
.field.ok{border-color:var(--ok)} .field.bad{border-color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.fchip{border:0;border-radius:999px;padding:7px 14px;font-size:14px;background:var(--s1);color:var(--tx2);display:inline-flex;gap:8px;align-items:center;min-height:36px}
.fchip.on{background:var(--tx);color:#000}
.item{background:var(--s1);border-radius:16px;margin-bottom:8px;overflow:hidden}
.item>button.head{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:15px 18px;color:var(--tx);min-height:56px}
.item>button.head .t{flex:1;min-width:0}
.item .body{padding:0 18px 18px 40px}
.item .body ul{margin:0 0 12px;padding:0;list-style:none}
.item .body li{padding:3px 0;color:var(--tx2)}
.item .body li.ok{color:var(--ok);font-weight:500}
.tblbox{overflow-x:auto;border-radius:16px;background:var(--s1)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:11px 16px;vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--tx2);letter-spacing:.02em;white-space:nowrap}
tr+tr td{border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:1px solid var(--line)}
td:first-child{font-weight:600;color:var(--c);white-space:nowrap}
.sheet{scroll-margin-top:90px;margin-bottom:44px}
.sheet .note{color:var(--tx2);margin:6px 0 16px;max-width:760px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:26px 0}
.fgrid label{display:block;font-size:14px;color:var(--tx2);margin-bottom:6px}
.fgrid .sol{font-size:14px;margin-top:6px;min-height:20px}
.fgrid .sol.ok{color:var(--ok)} .fgrid .sol.bad{color:var(--bad)}
.task{font-size:clamp(34px,6vw,60px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.steps{margin:0;padding-left:22px;color:var(--tx2)}
.steps li{margin:6px 0}
.steps code,code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em;color:var(--tx)}
.paste{border:1.5px dashed rgba(255,255,255,.28);border-radius:var(--r);padding:44px 24px;text-align:center;color:var(--tx2);min-height:160px;display:grid;place-items:center}
.paste:focus{outline:none;border-color:var(--blue);color:var(--tx)}
.foot{margin-top:72px;padding-top:22px;border-top:1px solid var(--line);color:var(--tx3);font-size:12px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 16px 72px}
  .hero{padding:44px 0 24px}
  .brand{display:none}
  .nav-in{padding-left:6px}
  .item .body{padding-left:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in"><button class="brand" id="brand">CCNA 1 Trainer</button><nav class="tabs" id="tabs" aria-label="Sections"></nav></div></header>
<main class="wrap" id="app"></main>
<script>
